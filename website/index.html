<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>www.cs5v5-play.com | CS 5v5</title>
  <meta name="description" content="CS 5v5 网页试玩入口，打开就是游戏首页，点击开始游玩进入全屏靶场。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-home" id="gameHome">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <div class="top-hud">
      <span class="brand-mark">5v5</span>
      <span>CS 5v5 Web</span>
    </div>

    <div class="score-hud" id="scoreHud" hidden>
      <span id="scoreText">得分 0</span>
      <span id="comboText">连击 x0</span>
      <span id="timeText">45</span>
    </div>

    <section class="home-panel" id="homePanel" aria-label="游戏首页">
      <p class="eyebrow">Android FPS Prototype</p>
      <h1>CS 5v5</h1>
      <p class="intro">
        玩家加入蓝队，带 4 名队友 AI 对战 5 名橙队敌人。正式试玩版包含 M416、巴雷特、战术匕首、手雷、激光塔、二段跳、趴下、角色兵种和 11 张地图规则。
      </p>
      <div class="quick-info">
        <span>5v5 单机战术射击</span>
        <span>电脑：鼠标瞄准 / 左键射击</span>
        <span>手机：点按靶心射击</span>
      </div>
      <button id="startButton" type="button">开始游玩</button>
    </section>

    <button id="restartButton" class="restart-button" type="button" hidden>重新开始</button>
    <p class="bottom-tip" id="bottomTip">介绍在首页，点击底部按钮开始游玩。进入后会尝试切换全屏。</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
